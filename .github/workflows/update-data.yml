name: Update Mami Lezza data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mami-lezza-update-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tarik sheet & bangun ulang data.js
        run: python3 build_data.py

      - name: Commit hanya kalau data berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f public/data.js ]; then
            TARGETS="public/data.js public/sheet_snapshot.csv.gz"
          else
            TARGETS="data.js sheet_snapshot.csv.gz"
          fi

          if git diff --quiet -- $TARGETS; then
            echo "Data tidak berubah — tidak ada commit."
            exit 0
          fi
          git add $TARGETS
          git commit -m "chore: refresh sheet data [skip ci]"
          git push
